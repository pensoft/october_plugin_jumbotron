{% set jumbotron = __SELF__.getJumbotron() %}
{% if jumbotron %}
{% partial __SELF__ ~ "::templates/" ~ (__SELF__.property('templates') ?: 'template3')
    jumbotron = jumbotron
    has_background = __SELF__.hasBackground()
%}
{% if __SELF__.loggedIn %}
<p><a class="edit-link" href="/admin/pensoft/jumbotron/jumbotron/update/{{ jumbotron.id }}" target="_blank">{{ 'Edit'|_ }}</a></p>
{% endif %}
{% endif %}
